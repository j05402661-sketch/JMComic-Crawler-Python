name: JM 下载

on:
  workflow_dispatch:
    inputs:
      album_ids:
        description: '本子 id，多个用空格或 - 分隔（例：422866 422867）'
        required: true
        type: string
      photo_ids:
        description: '章节 id（可留空；多个同上，会自动加 p 前缀）'
        required: false
        type: string
      client_impl:
        description: '客户端：api（移动端，默认）/ html（网页端）'
        required: false
        default: api
        type: choice
        options: [api, html]
      zip_name:
        description: '打包文件名'
        required: false
        default: jm-download.zip
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 jmcomic
        run: |
          python -m pip install --upgrade pip
          pip install jmcomic rich

      - name: 生成配置
        env:
          IMPL: ${{ inputs.client_impl }}
        run: |
          cat > option.yml <<'YAML'
          dir_rule:
            base_dir: ./download
            rule: Bd_Aauthor_Btitle
          download:
            image:
              batch_count: 4
              threading:
                image: 12
                photo: 4
          client:
            impl: __IMPL__
            domain: 18comic.vip
            retry_times: 5
            cache: null
          plugins:
            after_album:
              - plugin: zip
                kwargs:
                  level: photo
                  filename_rule: Atitle
                  zip_dir: ./download_zip
          YAML
          sed -i "s/__IMPL__/$IMPL/" option.yml

      - name: 下载
        env:
          ALBUM_IDS: ${{ inputs.album_ids }}
          PHOTO_IDS: ${{ inputs.photo_ids }}
        run: |
          python - <<'PY'
          import os, sys
          import jmcomic

          def norm(raw, prefix=False):
              if not raw:
                  return []
              items = raw.replace('-', ' ').replace(',', ' ').split()
              return [('p' + x.lstrip('p')) if prefix else x.lstrip('p') for x in items]

          albums = norm(os.environ.get('ALBUM_IDS', ''))
          photos = norm(os.environ.get('PHOTO_IDS', ''), prefix=True)
          print('本子:', albums, '章节:', photos)
          if not albums and not photos:
              print('没有 id')
              sys.exit(1)

          option = jmcomic.JmOption.from_file('option.yml')
          failed = []
          for aid in albums:
              try:
                  jmcomic.download_album(aid, option)
                  print('完成本子', aid)
              except Exception as e:
                  failed.append(('album', aid, repr(e)))
                  print('失败本子', aid, repr(e))
          for pid in photos:
              try:
                  jmcomic.download_photo(pid, option)
                  print('完成章节', pid)
              except Exception as e:
                  failed.append(('photo', pid, repr(e)))
                  print('失败章节', pid, repr(e))

          if failed:
              print('失败清单:', failed)
              sys.exit(2)
          PY

      - name: 打包
        id: pack
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          shopt -s nullglob
          files=(./download/* ./download/*/* ./download_zip/*)
          echo "找到 ${#files[@]} 个条目"
          if [ ${#files[@]} -eq 0 ]; then
            echo "has_files=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          zip -r "$ZIP_NAME" ./download ./download_zip -x '*.DS_Store' > /dev/null
          ls -lh "$ZIP_NAME"
          echo "has_files=true" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: 上传产物
        if: steps.pack.outputs.has_files == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.zip_name }}
          path: ${{ steps.pack.outputs.zip_name }}
          retention-days: 30
          if-no-files-found: warn
